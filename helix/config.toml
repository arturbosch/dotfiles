theme = "sandstone" # themes/sandstone.toml — mirrors bat/foot/kitty

[editor]
true-color = true
# line-number = "relative"
end-of-line-diagnostics = "hint"
idle-timeout = 100
shell = ["fish", "-c"]

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.lsp]
display-inlay-hints = true
display-messages = true

[editor.inline-diagnostics]
cursor-line = "error"

[editor.soft-wrap]
enable = true

[keys.normal]
C-s = ":w"
A-s = [":format", ":w"]
C-q = ":q"

A-n = "search_next"
A-N = "search_prev"

C-K    = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]
"C-S-up"   = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]
C-J    = ["extend_to_line_bounds", "delete_selection", "paste_after"]   
"C-S-down" = ["extend_to_line_bounds", "delete_selection", "paste_after"]   

esc = ["collapse_selection", "keep_primary_selection"]

space.B = ":sh git blame -L %{cursor_line},%{cursor_line} %{buffer_name}"
C-B = ":sh git blame -L %{cursor_line},%{cursor_line} %{buffer_name} | string split ' ' -f 1 | xargs git show"

C-y = [
  ':sh rm -f /tmp/unique-file',
  ':insert-output yazi "%{buffer_name}" --chooser-file=/tmp/unique-file',
  ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
  ':set mouse false',
  ':set mouse true',
]
